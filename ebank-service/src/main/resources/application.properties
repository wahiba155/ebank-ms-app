spring.application.name=ebank-service
server.port=8057

# Base de données H2 en mémoire et activation de la console H2
spring.datasource.url=jdbc:h2:mem:account-db
spring.h2.console.enabled=true

spring.cloud.discovery.enabled=false

# Service de configuration centralisé (désactivé temporairement)
spring.cloud.config.enabled=false